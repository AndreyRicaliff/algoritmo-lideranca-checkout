<title>QR — Pesquisa do evento | O Algoritmo da Liderança</title>
<style>
  :root { --accent:#E8B23A; --text:#1f2430; --muted:#6b7280; --border:#e2e4ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text); background:#fff; min-height:100svh;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .cartaz { text-align:center; max-width:560px; }
  .eyebrow { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#b9851f; }
  h1 { font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:-.01em; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:clamp(14px,2.4vw,18px); margin:0 0 26px; }
  .qr { width:min(64vmin,420px); height:auto; border:1px solid var(--border); border-radius:18px; padding:10px; }
  .url { font-size:clamp(13px,2.2vw,17px); color:var(--muted); margin-top:20px; word-break:break-all; }
  .url b { color:var(--text); }
  .print { margin-top:26px; font:inherit; font-size:14px; font-weight:700; color:#3a2b06;
    background:var(--accent); border:0; border-radius:10px; padding:12px 22px; cursor:pointer; }
  @media print {
    .print { display:none; }
    body { min-height:auto; }
    .qr { width:130mm; border:none; }
    @page { size:A4 portrait; margin:20mm; }
  }
</style>
</head>
