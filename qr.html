<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR — Avaliação | O Algoritmo da Liderança</title>
<style>
  :root { --ouro:#E8B23A; --ouro-forte:#f2c95c; --ouro-fosco:#a98632; --papel:#0b0906; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#f5efdf; min-height:100svh; display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
    background:
      radial-gradient(1100px 640px at 50% -12%, rgba(232,178,58,.16), transparent 62%),
      radial-gradient(900px 500px at 50% 115%, rgba(232,178,58,.07), transparent 60%),
      #050403; }
  .cartaz { text-align:center; max-width:640px; }
  .eyebrow { font-size:clamp(11px,1.8vmin,15px); letter-spacing:.22em; text-transform:uppercase;
    color:var(--ouro); }
  h1 { font-size:clamp(30px,6vmin,54px); font-weight:800; letter-spacing:-.015em; margin:10px 0 4px;
    background:linear-gradient(180deg,#fff8e8, var(--ouro-forte));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:#cbbd97; font-size:clamp(14px,2.6vmin,20px); margin:0 0 30px; }
  .moldura { display:inline-block; background:#fff; border-radius:22px; padding:14px;
    border:1px solid var(--ouro-fosco);
    box-shadow:0 0 0 6px rgba(232,178,58,.08), 0 24px 70px rgba(0,0,0,.75), 0 0 110px rgba(232,178,58,.18); }
  .qr { display:block; width:min(58vmin,430px); height:auto; }
  .url { font-size:clamp(13px,2.2vmin,18px); color:#cbbd97; margin-top:24px; word-break:break-all; }
  .url b { color:#fff8e8; }
  .slug { font-size:clamp(10px,1.5vmin,12px); color:#6f6244; letter-spacing:.08em; margin-top:6px; }
  .tagline { margin-top:26px; font-size:clamp(13px,2vmin,16px); color:#8f7f57; }
  .tagline b { color:var(--ouro); font-weight:700; }
  .aviso { color:#cbbd97; font-size:clamp(14px,2.4vmin,18px); line-height:1.6;
    border:1px dashed var(--ouro-fosco); border-radius:18px; padding:32px 26px; }
  .aviso b { color:var(--ouro); }
</style>
</head>
<body>
<div class="cartaz">
  <span class="eyebrow">AG Educação · O Algoritmo da Liderança</span>
  <h1>Avalie o treinamento</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div id="palco"></div>
</div>

<!-- qrcode-generator 2.0.4 (Kazuhiko Arase, MIT). Servido daqui, não de CDN: o cartaz é
     projetado na sala e não pode depender de rede de terceiro no meio do evento. -->
<script src="/assets/vendor/qrcode.js"></script>
<script>
(function () {
  'use strict';

  // O QR deixou de ser um SVG fixo colado no arquivo (era uma URL só, 51KB de markup) e
  // passou a ser gerado na hora: a 2ª turma tem uma pesquisa POR DIA, e cada dia precisa
  // do seu cartaz sem que ninguém precise editar HTML e publicar de novo.

  // Emblema AG do miolo. Coordenadas originais do logo; o <g> externo reposiciona conforme
  // o tamanho do QR, que varia com o comprimento da URL.
  var LOGO_X = 5431, LOGO_Y = 6024, LOGO_W = 10139, LOGO_H = 5067;
  var LOGO_PATHS =
    '<path fill="#0d0a04" d="M 5431,11091 L 10497,6024 15568,11080 13274,11091 10479,8352 7729,11091 5431,11091 Z"/>' +
    '<path fill="url(#ouroGrad)" d="M 14058,8352 L 15570,8351 15569,11080 14062,9578 14058,8352 Z M 10497,6024 L 15569,6024 15570,7510 11984,7506 10497,6024 Z"/>';

  var palco = document.getElementById('palco');
  var sub = document.getElementById('sub');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  // Correção 'H' (~30%) porque o emblema tapa o miolo: com correção menor o logo derruba a
  // leitura em celular ruim — que é justamente o celular que vai estar na sala.
  function svgDoQr(texto) {
    var qr = qrcode(0, 'H');
    qr.addData(texto);
    qr.make();
    var n = qr.getModuleCount();
    var margem = 2;                 // quiet zone, em módulos
    var lado = n + margem * 2;

    var s = '<svg class="qr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + lado + ' ' + lado +
      '" role="img" aria-label="QR code da pesquisa de avaliação">' +
      '<defs><linearGradient id="ouroGrad" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#d7bd77"/><stop offset="1" stop-color="#eac990"/>' +
      '</linearGradient></defs>' +
      '<rect width="' + lado + '" height="' + lado + '" fill="#fff"/>';

    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!qr.isDark(r, c)) continue;
        // 1.02 fecha o fio de branco que alguns renderizadores deixam entre módulos vizinhos
        s += '<rect x="' + (c + margem) + '" y="' + (r + margem) +
          '" width="1.02" height="1.02" fill="#0d0a04"/>';
      }
    }

    var alvo = lado * 0.24;                    // emblema ocupa ~24% do lado
    var escala = alvo / LOGO_W;
    var cx = lado / 2, cy = lado / 2;
    var cartao = alvo * 1.34;
    s += '<rect x="' + (cx - cartao / 2) + '" y="' + (cy - cartao / 2) +
      '" width="' + cartao + '" height="' + cartao + '" rx="' + (cartao * 0.16) +
      '" fill="#fff" stroke="#b9851f" stroke-width="' + (lado * 0.006) + '"/>' +
      '<g transform="translate(' + (cx - alvo / 2) + ',' + (cy - (LOGO_H * escala) / 2) + ') ' +
      'scale(' + escala + ') translate(' + (-LOGO_X) + ',' + (-LOGO_Y) + ')">' + LOGO_PATHS + '</g>';

    return s + '</svg>';
  }

  function aviso(html) {
    sub.textContent = '';
    palco.innerHTML = '<div class="aviso">' + html + '</div>';
  }

  function montar(d) {
    var base = location.origin;
    // O QR aponta pra pesquisa EXATA (?e=slug): imune a relógio e a virada de dia.
    // O endereço escrito embaixo é o curto, sem parâmetro — quem digita à mão cai na
    // pesquisa do dia, resolvida no banco pelo fuso de Brasília.
    var destino = base + '/pesquisa?e=' + encodeURIComponent(d.evento);
    var legivel = base.replace(/^https?:\/\//, '') + '/pesquisa';

    sub.textContent = (d.titulo ? d.titulo + ' — ' : '') +
      'Aponte a câmera do celular — anônimo, menos de 3 minutos.';

    palco.innerHTML =
      '<span class="moldura">' + svgDoQr(destino) + '</span>' +
      '<p class="url">ou acesse: <b>' + esc(legivel) + '</b></p>' +
      '<p class="slug">' + esc(d.evento) + (d.periodo ? ' · ' + esc(d.periodo) : '') + '</p>' +
      '<p class="tagline">Liderança não é dom. <b>É algoritmo.</b></p>';
  }

  var m = /[?&]e=([a-z0-9-]{1,60})(?:&|$)/i.exec(location.search);
  var url = '/api/nps-perguntas' + (m ? '?e=' + encodeURIComponent(m[1].toLowerCase()) : '');

  fetch(url)
    .then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (d) {
      if (!d) {
        aviso('Nenhuma pesquisa aberta para hoje.<br>' +
          'Publique a pesquisa do dia e recarregue esta página.');
        return;
      }
      if (!d.aberto) {
        aviso('A pesquisa <b>' + esc(d.titulo || d.evento) + '</b> está encerrada.<br>' +
          'Abra a pesquisa do dia antes de projetar o cartaz.');
        return;
      }
      montar(d);
    })
    .catch(function () {
      aviso('Não foi possível carregar a pesquisa.<br>Confira a conexão e recarregue.');
    });
})();
</script>
</body>
</html>
