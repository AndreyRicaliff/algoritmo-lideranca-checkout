<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E8B23A">
<meta name="robots" content="noindex">
<title>Avaliação — O Algoritmo da Liderança</title>
<style>
  :root {
    --accent:#E8B23A; --accent-ink:#3a2b06; --text:#1f2430; --muted:#6b7280;
    --bg:#ffffff; --soft:#f6f7f9; --border:#e2e4ec; --ring:rgba(232,178,58,.25);
    --ok:#1f9d57; --err:#c0392b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text); background:var(--soft); min-height:100svh; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  .eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#b9851f; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.01em; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .progress { height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin:0 0 16px; }
  .progress b { display:block; height:100%; width:0; background:var(--accent); border-radius:999px;
    transition:width .25s ease; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:16px;
    padding:20px 16px; box-shadow:0 8px 24px rgba(20,20,30,.06); }
  .secao-titulo { font-size:17px; font-weight:800; margin:0 0 2px; }
  .secao-titulo .marca { color:#b9851f; }
  .secao-sub { font-size:13px; color:var(--muted); margin:0 0 14px; }
  .legenda { font-size:12px; color:var(--muted); background:var(--soft); border-radius:8px;
    padding:8px 10px; margin:0 0 14px; }
  .linha { padding:12px 0 14px; border-top:1px solid var(--border); }
  .linha:first-of-type { border-top:0; padding-top:2px; }
  .linha .titulo { font-size:15px; font-weight:600; line-height:1.35; margin:0 0 10px; }
  .chips { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .chips.nps { grid-template-columns:repeat(6,1fr); }
  .chips button { min-height:46px; font:inherit; font-size:16px; font-weight:700;
    font-variant-numeric:tabular-nums; color:var(--text); background:var(--soft);
    border:1px solid var(--border); border-radius:10px; cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s; }
  .chips button:active { transform:scale(.95); }
  .chips button:focus-visible { outline:3px solid var(--ring); outline-offset:1px; }
  .chips button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
    color:var(--accent-ink); }
  .extremos { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:8px; }
  input.field, textarea.field { width:100%; padding:12px 13px; font:inherit; font-size:15px;
    color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:10px; }
  textarea.field { min-height:120px; resize:vertical; }
  .field:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--ring); }
  .campo-rotulo { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  .acoes { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:18px; }
  .voltar { font:inherit; font-size:14px; color:var(--muted); background:none; border:0;
    cursor:pointer; padding:12px 8px; min-height:44px; }
  .avancar { font:inherit; font-size:15px; font-weight:700; color:var(--accent-ink);
    background:var(--accent); border:0; border-radius:10px; padding:13px 26px; min-height:48px; cursor:pointer; }
  .skeleton { border-radius:16px; height:320px;
    background:linear-gradient(100deg,var(--border) 30%,#eef0f4 45%,var(--border) 60%);
    background-size:200% 100%; animation:sk 1.2s infinite linear; }
  @keyframes sk { to { background-position:-200% 0; } }
  .estado { text-align:center; padding:36px 18px; }
  .estado .icone { width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; }
  .estado.ok .icone { background:#e8f6ee; color:var(--ok); }
  .estado.falha .icone { background:#fdecea; color:var(--err); }
  .estado h2 { margin:0 0 8px; font-size:22px; }
  .estado p { color:var(--muted); font-size:14px; margin:0 0 6px; }
  .retry { margin-top:14px; }
  .aviso-fila { font-size:13px; color:#b9851f; background:#fdf7e8; border:1px solid #f0e2bf;
    border-radius:10px; padding:10px 12px; margin-top:14px; }
  .rodape { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  @media (prefers-reduced-motion: reduce) {
    .progress b, .chips button { transition:none; }
    .skeleton { animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">AG Educação · O Algoritmo da Liderança</span>
  <h1>Avaliação do treinamento</h1>
  <p class="sub">1ª turma · leva menos de 3 minutos · anônima (identificar-se é opcional)</p>
  <div class="progress" aria-hidden="true"><b id="barra"></b></div>
  <div id="palco"><div class="skeleton"></div></div>
  <input class="hp" id="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="rodape">Suas notas ajudam a melhorar as próximas edições.</p>
</div>

<script>
(function () {
  'use strict';
  var palco = document.getElementById('palco');
  var barra = document.getElementById('barra');
  var secoes = [];
  var rotulos = [];
  var passo = 0;
  var sessao = null;

  function ls(chave, valor) {
    try {
      if (arguments.length === 2) { localStorage.setItem(chave, JSON.stringify(valor)); return valor; }
      var v = localStorage.getItem(chave);
      return v === null ? null : JSON.parse(v);
    } catch (e) { return null; } // modo privado sem storage: segue sem persistência
  }

  sessao = ls('nps_sessao');
  if (!sessao) sessao = ls('nps_sessao', (crypto.randomUUID && crypto.randomUUID()) ||
    'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, function () {
      return Math.floor(Math.random() * 16).toString(16);
    }));
  var respostas = ls('nps_respostas') || {};
  var fila = ls('nps_fila') || [];

  // ---- Envio: cada resposta vai na hora; falhou, entra na fila e tenta depois ----
  function enviar(item) {
    item.sessao = sessao;
    item.site = document.getElementById('hp').value; // honeypot viaja junto
    return fetch('/api/nps', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(item),
    }).then(function (r) {
      if (!r.ok && r.status !== 204 && r.status !== 409) throw new Error(r.status);
    });
  }
  function despachar(item) {
    enviar(item).catch(function () {
      fila = fila.filter(function (f) { return f.pergunta_id !== item.pergunta_id; });
      fila.push(item);
      ls('nps_fila', fila);
      renderFila();
    });
  }
  function drenarFila() {
    if (!fila.length) return;
    var pendentes = fila.slice();
    fila = [];
    ls('nps_fila', fila);
    pendentes.forEach(function (i) {
      enviar(i).catch(function () { fila.push(i); ls('nps_fila', fila); renderFila(); });
    });
    renderFila();
  }
  window.addEventListener('online', drenarFila);
  document.addEventListener('visibilitychange', function () {
    // última chance ao sair: beacon não espera resposta e sobrevive ao fechamento da aba
    if (document.visibilityState === 'hidden' && fila.length && navigator.sendBeacon) {
      fila.forEach(function (i) {
        i.sessao = sessao;
        navigator.sendBeacon('/api/nps', new Blob([JSON.stringify(i)], { type: 'application/json' }));
      });
      fila = []; ls('nps_fila', fila);
    }
  });

  function renderFila() {
    var el = document.getElementById('aviso-fila');
    if (el) el.style.display = fila.length ? 'block' : 'none';
  }

  function avisoFila() {
    var el = document.createElement('div');
    el.className = 'aviso-fila'; el.id = 'aviso-fila';
    el.textContent = 'Sem conexão agora — suas respostas estão guardadas e serão enviadas sozinhas.';
    el.style.display = fila.length ? 'block' : 'none';
    return el;
  }

  // ---- Telas (uma por seção) ----
  function render() {
    barra.style.width = Math.round((passo / secoes.length) * 100) + '%';
    if (passo >= secoes.length) return fim();
    var s = secoes[passo];
    var card = document.createElement('div');
    card.className = 'card';

    var t = document.createElement('p');
    t.className = 'secao-titulo';
    var partes = s.titulo.split(' · ');
    t.innerHTML = partes.length === 2
      ? '<span class="marca">' + esc(partes[0]) + '</span> · ' + esc(partes[1])
      : esc(s.titulo);
    card.appendChild(t);
    var st = document.createElement('p');
    st.className = 'secao-sub';
    st.textContent = (passo + 1) + '/' + secoes.length + (s.sub ? ' — ' + s.sub : '');
    card.appendChild(st);

    var temEscala = s.perguntas.some(function (q) { return q.tipo === 'escala'; });
    if (temEscala) {
      var leg = document.createElement('p');
      leg.className = 'legenda';
      leg.textContent = '1 = ' + rotulos[0] + ' · 5 = ' + rotulos[4];
      card.appendChild(leg);
    }

    s.perguntas.forEach(function (q) {
      if (q.tipo === 'texto') return campoTexto(card, q, s.id === 'comentario');
      linhaEscala(card, q);
    });

    var acoes = document.createElement('div');
    acoes.className = 'acoes';
    var voltar = document.createElement('button');
    voltar.className = 'voltar'; voltar.type = 'button';
    voltar.textContent = '← anterior';
    voltar.style.visibility = passo === 0 ? 'hidden' : 'visible';
    voltar.onclick = function () { salvarTextos(s); passo--; render(); };
    var avancar = document.createElement('button');
    avancar.className = 'avancar'; avancar.type = 'button';
    avancar.textContent = passo === secoes.length - 1 ? 'Concluir' : 'Avançar';
    avancar.onclick = function () { salvarTextos(s); passo++; render(); };
    acoes.appendChild(voltar);
    acoes.appendChild(avancar);
    card.appendChild(acoes);

    palco.replaceChildren(card, avisoFila());
    window.scrollTo({ top: 0 });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }

  function linhaEscala(card, q) {
    var linha = document.createElement('div');
    linha.className = 'linha';
    var t = document.createElement('p');
    t.className = 'titulo';
    t.textContent = q.texto;
    linha.appendChild(t);
    var chips = document.createElement('div');
    chips.className = 'chips' + (q.tipo === 'nps' ? ' nps' : '');
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', q.texto);
    var de = q.tipo === 'nps' ? 0 : 1;
    var ate = q.tipo === 'nps' ? 10 : 5;
    for (var v = de; v <= ate; v++) (function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = v;
      if (q.tipo === 'escala') b.title = rotulos[v - 1];
      b.setAttribute('aria-pressed', String(respostas[q.id] === v));
      b.onclick = function () {
        respostas[q.id] = v; ls('nps_respostas', respostas);
        chips.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        despachar({ pergunta_id: q.id, valor: v });
      };
      chips.appendChild(b);
    })(v);
    linha.appendChild(chips);
    if (q.min || q.max) {
      var ex = document.createElement('div');
      ex.className = 'extremos';
      ex.innerHTML = '<span></span><span></span>';
      ex.children[0].textContent = de + ' · ' + (q.min || '');
      ex.children[1].textContent = ate + ' · ' + (q.max || '');
      linha.appendChild(ex);
    }
    card.appendChild(linha);
  }

  function campoTexto(card, q, longo) {
    var rotulo = document.createElement('label');
    rotulo.className = 'campo-rotulo';
    rotulo.textContent = q.texto;
    rotulo.htmlFor = 'campo-' + q.id;
    card.appendChild(rotulo);
    var campo = document.createElement(longo ? 'textarea' : 'input');
    campo.className = 'field';
    campo.id = 'campo-' + q.id;
    campo.maxLength = q.max || 1000;
    campo.dataset.pergunta = q.id;
    if (!longo) campo.autocomplete = 'off';
    if (typeof respostas[q.id] === 'string') campo.value = respostas[q.id];
    card.appendChild(campo);
  }

  // Textos são enviados ao trocar de tela (não a cada tecla)
  function salvarTextos(s) {
    s.perguntas.forEach(function (q) {
      if (q.tipo !== 'texto') return;
      var campo = document.getElementById('campo-' + q.id);
      if (!campo) return;
      var v = campo.value.trim();
      if (v && v !== respostas[q.id]) {
        respostas[q.id] = v; ls('nps_respostas', respostas);
        despachar({ pergunta_id: q.id, texto: v.slice(0, q.max || 1000) });
      }
    });
  }

  function fim() {
    barra.style.width = '100%';
    var div = document.createElement('div');
    div.className = 'card estado ok';
    div.innerHTML =
      '<div class="icone"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<h2>Obrigado!</h2><p>Sua avaliação ajuda a construir as próximas turmas.</p>' +
      '<p><b>AG Educação · O Algoritmo da Liderança</b></p>';
    var aviso = avisoFila();
    aviso.textContent = 'Algumas respostas aguardam conexão — deixe a página aberta um instante.';
    div.appendChild(aviso);
    palco.replaceChildren(div);
    drenarFila();
  }

  function erroCarga() {
    var div = document.createElement('div');
    div.className = 'card estado falha';
    div.innerHTML =
      '<div class="icone"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>' +
      '<h2>Não carregou</h2><p>Confira a conexão e tente de novo.</p>';
    var b = document.createElement('button');
    b.className = 'avancar retry'; b.type = 'button'; b.textContent = 'Tentar novamente';
    b.onclick = carregar;
    div.appendChild(b);
    palco.replaceChildren(div);
  }

  function carregar() {
    palco.innerHTML = '<div class="skeleton"></div>';
    fetch('/api/nps-perguntas')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        secoes = d.secoes;
        rotulos = d.escalaRotulos;
        // reabriu? retoma na primeira seção com pergunta em aberto (identificação não conta)
        passo = 0;
        for (var i = secoes.length - 1; i >= 0; i--) {
          var todas = secoes[i].perguntas.every(function (q) { return q.id in respostas; });
          if (todas) { passo = Math.min(i + 1, secoes.length); break; }
        }
        render();
        drenarFila();
      })
      .catch(erroCarga);
  }
  carregar();
})();
</script>
</body>
</html>
